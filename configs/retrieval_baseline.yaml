# Phase 1 baseline: how well do dense, sparse and hybrid retrieval find the gold
# documents for the Northbridge QA set, with each embedding model?
#   python -m secrag eval-retrieval --config configs/retrieval_baseline.yaml
name: retrieval_baseline
description: Dense vs BM25 vs hybrid (RRF) retrieval on the Northbridge corpus, two embedders.
seed: 13

data:
  corpus_dirs: [data/corpus/northbridge]
  qa_path: data/qa/northbridge_qa.jsonl

chunking:
  chunk_size: 120   # words of new content per chunk
  overlap: 20       # words repeated from the previous chunk

embedder:
  provider: ollama
  model: nomic-embed-text

retrieval:
  method: hybrid
  top_k: 5
  candidate_k: 50
  rrf_k: 60

eval:
  ks: [1, 3, 5, 10]
  bootstrap_samples: 2000
  confidence: 0.95

# 3 methods x 2 embedders = 6 runs (sparse ignores the embedder, so its two runs agree).
grid:
  retrieval.method: [dense, sparse, hybrid]
  embedder:
    - {provider: ollama, model: nomic-embed-text}
    - {provider: sentence_transformers, model: BAAI/bge-small-en-v1.5}
